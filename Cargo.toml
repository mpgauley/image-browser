[package]
name = "image-browser"
version = "0.1.0"
edition = "2024"
description = "A Linux desktop file browser focused on images"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "0.31.1", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
image = { version = "0.25.10", features = ["avif-native"] }
rfd = "0.15.4"
