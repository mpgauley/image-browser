name: Linux packages

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    name: Build Linux install packages
    runs-on: ubuntu-22.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            libdav1d-dev \
            libgtk-3-dev \
            libwayland-dev \
            libxkbcommon-dev \
            libgl1-mesa-dev \
            meson \
            ninja-build \
            nasm \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install nfpm
        uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install nfpm tool
        run: go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.41.3

      - name: Determine package version
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "image-browser") | .version')"
          fi
          echo "PACKAGE_VERSION=$version" >> "$GITHUB_ENV"

      - name: Build application
        env:
          SYSTEM_DEPS_DAV1D_BUILD_INTERNAL: always
        run: cargo build --release --locked

      - name: Build Debian, RPM, and Arch packages
        run: |
          mkdir -p dist
          nfpm package --config packaging/nfpm.yaml --packager deb --target "dist/image-browser_${PACKAGE_VERSION}_amd64.deb"
          nfpm package --config packaging/nfpm.yaml --packager rpm --target "dist/image-browser-${PACKAGE_VERSION}-1.x86_64.rpm"
          nfpm package --config packaging/nfpm.yaml --packager archlinux --target "dist/image-browser-${PACKAGE_VERSION}-1-x86_64.pkg.tar.zst"

      - name: Upload packages to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: image-browser-linux-packages-${{ env.PACKAGE_VERSION }}
          path: dist/*
          if-no-files-found: error
          retention-days: 30

      - name: Attach packages to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
